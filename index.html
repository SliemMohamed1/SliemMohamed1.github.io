<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sliem GTeck | Links</title>
    <style>
        body {
            
            background-image: linear-gradient(rgba(13, 13, 18, 0.8), rgba(42, 8, 69, 0.8)), url('bg.jpg');
            background-size: 115%; /* كبرنا الصورة سيكا عشان نديها مساحة تتحرك */
            background-position: center;
            background-attachment: fixed;
            animation: panBackground 15s ease-in-out infinite alternate;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 50px 20px;
            min-height: 100vh;
        }

       
        @keyframes panBackground {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid #8a2be2;
            margin-bottom: 15px;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.5);
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 26px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.7);
        }
        p {
            margin: 0 0 30px 0;
            color: #a0a0a0;
            font-size: 15px;
        }
        .link-btn {
            background-color: transparent;
            border: 2px solid #8a2be2;
            color: #ffffff;
            padding: 15px 20px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .link-btn:hover {
            background-color: #8a2be2;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.6);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    
    <img src="profile.jpg" alt="Sliem GTeck" class="profile-img">

    <h1>Sliem GTech</h1>
    <p>Gaming & Tech</p>

    
    <a href="https://www.tiktok.com/@tanjirogmr" class="link-btn">Tik Tok</a>
    <a href="https://www.youtube.com/@user-tanjiro" class="link-btn">Youtube</a>
    <a href="https://www.linkedin.com/in/sliem-mohamed" class="link-btn">LinkedIn</a>
    <a href="https://open.spotify.com/user/31gnnv3flmtj3igce4cyiioown54?si=857eafd6f5fc49cf" class="link-btn">Spotify</a>

</body>
</html>
